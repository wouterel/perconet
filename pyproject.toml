[project]
name = "perconet"
version = "0.4.4"
description = "Analyze percolation properties of periodic networks"
authors = [
    { name = "Chiara Raffaelli and Wouter Ellenbroek" }
]
homepage = "https://github.com/wouterel/perconet"
requires-python = ">=3.9,<3.16"
dependencies = [
    "numpy>=1.23,<2.1 ; python_version < '3.10'",
    "numpy>=1.23,<2.3 ; python_version >= '3.10' and python_version < '3.11'",
    "numpy>=1.26,<2.5 ; python_version >= '3.11' and python_version < '3.12'",
    "numpy>=1.26,<2.6 ; python_version >= '3.12' and python_version < '3.16'",
]
readme = "README.rst"
license = "EUPL-1.2"
dynamic = [ "classifiers" ]


[tool.poetry]
classifiers = [
	"Intended Audience :: Science/Research",
	"Development Status :: 4 - Beta"
]


[project.urls]
repository = "https://github.com/wouterel/perconet"
documentation = "https://perconet.readthedocs.io/"

[tool.poetry.group.dev.dependencies]
toml = "^0.10.2"
sympy = "^1.9"
Sphinx = "^4.3.0"
sphinx-rtd-theme = "^1.0.0"
flake8 = "^4.0.1"
pytest = "^8.0.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
